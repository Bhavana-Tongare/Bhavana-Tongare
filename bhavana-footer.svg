<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="bt-foot-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bt-foot-title">Thanks for visiting</title>
  <defs>
    <linearGradient id="bt-foot-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.5" stop-color="#451126"/>
      <stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <linearGradient id="bt-foot-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bt-foot-clip"><rect width="1200" height="110" rx="14"/></clipPath>
  </defs>
  <style>
    .bt-foot-text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:18px;letter-spacing:3px}
  </style>
  <g clip-path="url(#bt-foot-clip)">
    <rect width="1200" height="110" fill="url(#bt-foot-bg)"/>
    <text class="bt-foot-text" x="600" y="58" text-anchor="middle" fill="#E5B5C7">THANKS FOR VISITING</text>
    <rect x="400" y="74" width="400" height="2" rx="1" fill="url(#bt-foot-line)"/>
    <circle cy="75" r="4" fill="#F8F0F3">
      <animate attributeName="cx" values="400;800;400" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
