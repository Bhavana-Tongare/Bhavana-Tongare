<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="bt-hero-title bt-hero-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bt-hero-title">Bhavana Tongare</title>
  <desc id="bt-hero-desc">Data Analytics, Data Science and AI/ML. B.Tech in Artificial Intelligence and Data Science, Nashik.</desc>
  <defs>
    <linearGradient id="bt-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="bt-hero-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bt-hero-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <radialGradient id="bt-hero-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#701A3D" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bt-hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="bt-hero-gridfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
    <mask id="bt-hero-gridmask">
      <rect width="1200" height="380" fill="url(#bt-hero-gridfade)"/>
    </mask>
    <filter id="bt-hero-blur" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="bt-hero-clip"><rect width="1200" height="380" rx="18"/></clipPath>
  </defs>
  <style>
    .bt-name{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:76px;letter-spacing:1px}
    .bt-role{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:26px;letter-spacing:4px}
    .bt-sub{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:17px;letter-spacing:1.5px}
    .bt-trace{stroke-dasharray:220 1400;animation:bt-run 9s linear infinite}
    @keyframes bt-run{from{stroke-dashoffset:1620}to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.bt-trace{animation:none}}
  </style>
  <g clip-path="url(#bt-hero-clip)">
    <rect width="1200" height="380" fill="url(#bt-hero-bg)"/>
    <rect width="1200" height="380" fill="url(#bt-hero-grid)" mask="url(#bt-hero-gridmask)"/>
    <!-- drifting light -->
    <ellipse cx="300" cy="130" rx="420" ry="230" fill="url(#bt-hero-glow)">
      <animate attributeName="cx" values="260;900;260" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <!-- technical path: static base + travelling pulse -->
    <path id="bt-hero-path" d="M0 322 H150 L190 282 H420 L460 322 H760 L800 292 H1010 L1050 332 H1200"
          fill="none" stroke="#C77B9B" stroke-opacity="0.28" stroke-width="2" stroke-linejoin="round"/>
    <path class="bt-trace" d="M0 322 H150 L190 282 H420 L460 322 H760 L800 292 H1010 L1050 332 H1200"
          fill="none" stroke="#E5B5C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle r="5" fill="#F8F0F3">
      <animateMotion dur="9s" repeatCount="indefinite" path="M0 322 H150 L190 282 H420 L460 322 H760 L800 292 H1010 L1050 332 H1200"/>
    </circle>
    <g fill="#C77B9B" fill-opacity="0.7">
      <circle cx="150" cy="322" r="3.5"/><circle cx="420" cy="282" r="3.5"/>
      <circle cx="760" cy="322" r="3.5"/><circle cx="1010" cy="292" r="3.5"/>
    </g>
    <!-- text -->
    <text class="bt-name" x="600" y="148" text-anchor="middle" fill="url(#bt-hero-name)">Bhavana Tongare</text>
    <!-- glowing underline -->
    <rect x="300" y="172" width="600" height="4" rx="2" fill="url(#bt-hero-line)" filter="url(#bt-hero-blur)" opacity="0.9">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="300" y="172" width="600" height="3" rx="1.5" fill="url(#bt-hero-line)"/>
    <text class="bt-role" x="600" y="226" text-anchor="middle" fill="#E5B5C7">DATA ANALYTICS  •  DATA SCIENCE  •  AI / ML</text>
    <text class="bt-sub" x="600" y="262" text-anchor="middle" fill="#C77B9B">B.Tech in Artificial Intelligence &amp; Data Science  ·  Nashik, India</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="18" fill="none" stroke="#701A3D" stroke-opacity="0.8"/>
</svg>
